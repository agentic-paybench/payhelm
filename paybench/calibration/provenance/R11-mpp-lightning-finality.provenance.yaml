calibration_date: "2026-06-04"
confidence: medium
fixture_content_hash: ""
notes: >
  Body HIGH confidence (~0.38s single-hop / sub-1s typical); tail shape well-described (hop count +
  retries) but exact P90/P99 in seconds NOT published. Median 0.8s allows for multi-hop + small
  Lightspark API overhead above the 0.38s single-hop floor. sigma_log 0.80 = heavy right tail
  (P99 ~5s; rare retry loops can reach ~30s per operator anecdote). Lightning MPP widens the upper
  tail vs clean single-hop (atomic on slowest part). R3 regtest is a body proxy only. Refine when
  R11 Lightspark access lands and first-party multi-hop runs are captured.
